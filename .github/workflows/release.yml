name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify the project
        run: |
          npm ci
          npm run check
          npm run lint
          npm test

      # Requires an NPM_TOKEN secret in the repository settings.
      # Publishes with provenance, so the npm page links back to this workflow run.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the package archive
        run: npm pack

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" web-vlc-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" web-vlc-*.tgz --generate-notes --title "web_vlc $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
